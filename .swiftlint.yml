# SwiftLint Configuration — MotorolaCPS
# HeiloProjects standard rules, tuned for reverse engineering / binary analysis

# Paths to lint
included:
  - CPSApp/Sources
  - Packages/RadioCore/Sources
  - Packages/RadioModels/Sources
  - Packages/RadioHardware/Sources
  - Packages/AudioEngine/Sources

# Paths to exclude
excluded:
  - .build
  - .swiftpm
  - DerivedData
  - Packages/*/Tests
  - Moto.Net

# Disabled rules — handled by formatter or too noisy for this project
disabled_rules:
  - trailing_whitespace       # swift-format handles
  - trailing_comma            # project uses trailing commas consistently
  - todo                      # TODOs are expected in reverse engineering work
  - inclusive_language         # radio protocol terms use domain-specific language

# Opt-in rules for stricter quality
opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - fallthrough
  - fatal_error_message
  - last_where
  - modifier_order
  - overridden_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call

# Rule configuration
line_length:
  # SwiftUI .help() strings and chained modifiers run long by design.
  # warning=160 flags accidental overruns; error=300 catches egregious cases.
  warning: 160
  error: 300
  ignores_urls: true
  ignores_comments: true

function_body_length:
  # Protocol packet parsers (XCMP/XNL state machines) legitimately require
  # long sequential logic. warning=80 for normal code, error=300 for parsers.
  warning: 80
  error: 300

type_body_length:
  # Large protocol actors (MOTOTRBOProgrammer ~1000 lines) are unavoidable
  # without splitting the protocol spec across files.
  warning: 400
  error: 1100

file_length:
  # XCMPProtocol.swift implements the full XCMP packet spec (2735 lines).
  # Large files are expected in protocol implementation work.
  warning: 1000
  error: 3000

cyclomatic_complexity:
  # XCMP/XNL protocol parsers dispatch on 50+ opcode variants — high
  # complexity is inherent to the domain, not a quality issue.
  warning: 20
  error: 70

function_parameter_count:
  warning: 6
  error: 8

nesting:
  type_level: 2
  function_level: 3

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - i
    - j
    - k
    - x
    - y
    - id
    - to
    - db
  allowed_symbols:
    - _

type_name:
  min_length:
    warning: 3
    error: 1
  max_length:
    warning: 50
    error: 60
  allowed_symbols:
    - _

large_tuple:
  warning: 4
  error: 5

# Custom rules
custom_rules:
  no_print_statements:
    name: "No print() Statements"
    regex: '^\s*print\s*\('
    message: "Use os.Logger instead of print(). See TASK-089."
    severity: warning
